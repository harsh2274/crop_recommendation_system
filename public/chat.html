<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Helper SMS Simulator</title>
<meta name="description" content="Chat with the Farm Helper SMS assistant in your browser: the same conversation, map, analysis and PDF report as the real phone number.">
<style>
  :root { --brand: #1f6b45; --brand-ink: #fff; --ink: #1f2523; --muted: #6b7370; --in: #e9edeb; --bg: #f3f5f4; --frame: #fff; --line: #d9dedc; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6ebe9; --muted: #9aa5a1; --in: #2a312e; --bg: #141816; --frame: #1c2120; --line: #333b38; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 440px; height: 100dvh; display: flex; flex-direction: column; background: var(--frame); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { background: var(--brand); color: var(--brand-ink); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .who { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 1.05rem; }
  header p { margin: 0; font-size: .8rem; opacity: .85; }
  header button, header a { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: .8rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .note { font-size: .8rem; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #log { flex: 1; overflow-y: auto; padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .in { align-self: flex-start; background: var(--in); border-bottom-left-radius: 4px; }
  .out { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .sys { align-self: center; font-size: .8rem; color: var(--muted); text-align: center; max-width: 90%; }
  .msg a { color: inherit; font-weight: 600; }
  .typing { align-self: flex-start; color: var(--muted); font-size: .85rem; padding: 2px 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--line); scrollbar-width: thin; }
  .chips button { flex: 0 0 auto; border: 1px solid var(--brand); color: var(--brand); background: transparent; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .chips button { color: #8fd3ad; border-color: #4f9a72; } }
  form { display: flex; gap: 8px; padding: 8px 12px 12px; }
  #text { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px; font: inherit; background: var(--bg); color: var(--ink); }
  #send { border: 0; border-radius: 20px; padding: 0 18px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="who"><h1>Farm Helper</h1><p>SMS simulator · same assistant as the phone number</p></div>
    <button id="reset" type="button" title="Start a new conversation">New chat</button>
    <a href="/" title="Back to the demo page">Demo</a>
  </header>
  <div class="note">Text it like a phone, in any language. Links open in a new tab; after you press Continue on the map, come back here.</div>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="text" maxlength="500" placeholder="Text message" aria-label="Text message">
    <button id="send">Send</button>
  </form>
</div>
<script>
(() => {
  const QUICK = ["Hello, I grow corn and soybeans", "Hola, cultivo maíz y soya", "YES", "NO", "LINK", "PDF", "How and where should I sell my crops?", "RESET"];
  const POLL_MS = 1500, WAIT_MS = 120000;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));

  let state = store.get("fh-chat") || { session: newId(), after: 0, log: [] };
  let waitingSince = 0;
  const save = () => store.set("fh-chat", state);

  function linkify(text) {
    const esc = text.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    return esc.replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  }
  function render() {
    const log = $("log");
    log.innerHTML = state.log.map((m) => `<div class="${m.dir === "sys" ? "sys" : `msg ${m.dir}`}">${linkify(m.body)}</div>`).join("");
    if (waitingSince) log.insertAdjacentHTML("beforeend", '<div class="typing">Farm Helper is typing…</div>');
    if (!state.log.length) log.innerHTML = '<div class="sys">Say hello to start, or tap a suggestion below.</div>';
    log.scrollTop = log.scrollHeight;
  }
  function add(dir, body) { state.log.push({ dir, body, at: Date.now() }); save(); render(); }

  async function send(text) {
    text = text.trim();
    if (!text) return;
    add("out", text);
    waitingSince = Date.now();
    render();
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: state.session, text }) });
      const out = await res.json().catch(() => ({}));
      if (!out.ok) {
        waitingSince = 0;
        add("sys", out.error === "limit" ? "This demo conversation reached its message limit. Press New chat to start again." : "That message could not be sent. Please try again.");
      }
    } catch {
      waitingSince = 0;
      add("sys", "No connection. Please try again.");
    }
    poll();
  }

  let polling = false;
  async function poll() {
    if (polling || document.hidden) return;
    polling = true;
    try {
      const res = await fetch(`/api/chat?session=${state.session}&after=${state.after}`);
      const { messages = [] } = await res.json();
      for (const m of messages) { state.log.push({ dir: "in", body: m.body, at: m.at }); state.after = m.n; }
      if (messages.length) { waitingSince = 0; save(); render(); }
      else if (waitingSince && Date.now() - waitingSince > WAIT_MS) { waitingSince = 0; render(); }
    } catch {} finally { polling = false; }
  }

  $("chips").innerHTML = QUICK.map((q) => `<button type="button">${q.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)}</button>`).join("");
  $("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("text").value; $("text").value = ""; send(t); });
  $("reset").addEventListener("click", () => { state = { session: newId(), after: 0, log: [] }; waitingSince = 0; save(); render(); });
  document.addEventListener("visibilitychange", poll);
  setInterval(poll, POLL_MS);
  render();
  poll();
})();
</script>
</body>
</html>
